[project]
name = "defect-inspection-mlops"
version = "0.1.0"
description = "NEU steel-defect classifier with a human-in-the-loop retraining loop."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
train = []
serve = []
ui = []

[tool.uv]
package = false
required-version = ">=0.13.6"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config -ra"
markers = [
    "slow: long-running test",
    "manual: needs a human or external service; run on purpose only",
    "needs_data: needs the dataset (DVC-pulled) on disk",
    "needs_model: needs a trained model artifact on disk",
]
