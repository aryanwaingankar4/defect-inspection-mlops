# Single source of seeds, sizes, hyperparameters, thresholds and gate rules.

data:
  raw_dir: data/raw                              # DVC/git-ignored NEU images (ADR-015)
  split_file: data/splits/neu_split_v1.csv       # committed: path,class,split

split:
  seed: 42                                       # split-only seed; independent of training seeds
  # Images per class, cut in this order after a seeded shuffle. Must sum to 300 (NEU per class).
  per_class:
    train_v1: 25
    val: 30
    test_frozen: 60
    production_stream: 185

preprocess:                        # used by src/serving/preprocess.py only (train, eval, serve)
  image_size: 224                  # square output side in pixels
  interpolation: bilinear          # resize filter: nearest | bilinear | bicubic | lanczos
  mean: [0.485, 0.456, 0.406]      # ImageNet, per channel, on [0,1] pixels
  std: [0.229, 0.224, 0.225]       # ImageNet, per channel

train:                             # src/training/train.py; full runs on Kaggle GPU only (ADR-019)
  seed: 1                          # training seed, independent of split.seed
  model: efficientnet_b0           # timm model name
  pretrained: true                 # ImageNet weights (downloaded once from the HF Hub)
  train_splits: [train_v1]         # feedback is added in Phase 3 (TASK-028)
  val_split: val                   # early stopping; never test_frozen
  lr: 0.0003                       # AdamW
  weight_decay: 0.01               # AdamW
  batch_size: 16
  max_epochs: 40
  patience: 8                      # stop after this many epochs without val macro-F1 improvement
  num_workers: 0                   # DataLoader workers (CLI --num-workers overrides, e.g. on Kaggle)
  augment:                         # training only (src/training/augment.py)
    hflip_p: 0.5
    vflip_p: 0.5
    rotation_deg: 10               # angle drawn from [-10, 10]; corners filled with the image's mean grey
    brightness: 0.10               # factor drawn from [0.9, 1.1]
    contrast: 0.10                 # factor drawn from [0.9, 1.1]
  out_checkpoint: models/baseline/best.pt  # git-ignored (CLI --out-checkpoint overrides)
  out_dir: results/train           # val metrics + training curve (CLI --out-dir overrides)
  smoke:                           # `--smoke`: tiny end-to-end check, allowed on a CPU laptop
    images_per_class: 2            # per split, first N per class in split-CSV order
    max_epochs: 1
    out_dir: models/smoke          # checkpoint + results of smoke runs; git-ignored

tracking:                          # MLflow (ADR-018). Server from env MLFLOW_TRACKING_URI, else local_uri
  experiment: neu-training
  registered_model: steel-defect-classifier
  smoke_experiment: neu-smoke      # --smoke runs never touch the real experiment or model name
  smoke_registered_model: steel-defect-classifier-smoke
  local_uri: sqlite:///mlruns/mlflow.db   # offline fallback (git-ignored); registry needs a DB store;
                                          # artifacts go to mlruns/artifacts next to it

kaggle:                            # TASK-010: all full training runs on Kaggle GPU (ADR-019)
  dataset_slug: neu-det-private    # PRIVATE dataset owned by the account in ~/.kaggle/kaggle.json
  dataset_title: NEU-DET private copy
  kernel_slug: neu-train-launcher  # private notebook; logic-free launcher
  kernel_title: neu-train-launcher
  accelerator: NvidiaTeslaT4       # "GPU T4 x2". P100 is retired on Kaggle and unsupported by torch 2.15 (CUDA 13)
  num_workers: 2
  repo_url: https://github.com/aryanwaingankar4/defect-inspection-mlops.git
  uv_version: 0.13.6
  notebook_template: notebooks/kaggle_train_launcher.ipynb
  staging_dir: build/kaggle-dataset   # git-ignored; never write into data/raw (would change its DVC hash)
  kernel_dir: build/kaggle-kernel     # rendered notebook + kernel-metadata.json
  output_dir: build/kaggle-output     # downloaded run outputs

near_duplicates:
  hash_size: 8                     # pHash bits = hash_size^2 = 64
  max_distance: 8                  # cross-split pairs with Hamming distance <= this go to the CSV
  report_distances: [0, 2, 4, 6, 8]  # cumulative counts (<= d) in the summary
  alert_distance: 2                # pairs <= this are exact/near-exact: report before any re-split
  grid_top_k: 12                   # closest cross-split pairs shown in the local PNG grid
  out_csv: results/near_duplicates.csv
  out_summary: results/near_duplicates_summary.json
  out_grid: results/private/near_duplicates_grid.png  # real NEU pixels: git-ignored (ADR-015)
