data:
  raw_dir: /kaggle/input/datasets/aryanwaingankar/neu-det-private
  split_file: data/splits/neu_split_v1.csv
split:
  seed: 42
  per_class:
    train_v1: 25
    val: 30
    test_frozen: 60
    production_stream: 185
preprocess:
  image_size: 224
  interpolation: bilinear
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
train:
  seed: 1
  model: efficientnet_b0
  pretrained: true
  train_splits:
  - train_v1
  val_split: val
  lr: 0.0003
  weight_decay: 0.01
  batch_size: 16
  max_epochs: 40
  patience: 8
  num_workers: 2
  augment:
    hflip_p: 0.5
    vflip_p: 0.5
    rotation_deg: 10
    brightness: 0.1
    contrast: 0.1
  out_checkpoint: /kaggle/working/models/baseline/best.pt
  out_dir: /kaggle/working/results/train
  smoke:
    images_per_class: 2
    max_epochs: 1
    out_dir: models/smoke
tracking:
  experiment: neu-training
  registered_model: steel-defect-classifier
  smoke_experiment: neu-smoke
  smoke_registered_model: steel-defect-classifier-smoke
  local_uri: sqlite:///mlruns/mlflow.db
kaggle:
  dataset_slug: neu-det-private
  dataset_title: NEU-DET private copy
  kernel_slug: neu-train-launcher
  kernel_title: neu-train-launcher
  accelerator: NvidiaTeslaT4
  num_workers: 2
  repo_url: https://github.com/aryanwaingankar4/defect-inspection-mlops.git
  uv_version: 0.13.6
  notebook_template: notebooks/kaggle_train_launcher.ipynb
  staging_dir: build/kaggle-dataset
  kernel_dir: build/kaggle-kernel
  output_dir: build/kaggle-output
near_duplicates:
  hash_size: 8
  max_distance: 8
  report_distances:
  - 0
  - 2
  - 4
  - 6
  - 8
  alert_distance: 2
  grid_top_k: 12
  out_csv: results/near_duplicates.csv
  out_summary: results/near_duplicates_summary.json
  out_grid: results/private/near_duplicates_grid.png
