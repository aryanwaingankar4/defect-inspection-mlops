data:
  raw_dir: /kaggle/input/datasets/aryanwaingankar/neu-det-private
  split_file: data/splits/neu_split_v2.csv
  split_file_v1: data/splits/neu_split_v1.csv
  archive_dir: data/archive
split:
  seed: 42
  per_class:
    train_v1: 25
    val: 30
    test_frozen: 60
    production_stream: 185
  groups:
    max_size_outside_last: 3
preprocess:
  image_size: 224
  interpolation: bilinear
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
train:
  seed: 1
  model: efficientnet_b0
  pretrained: true
  train_splits:
  - train_v1
  val_split: val
  lr: 0.0003
  weight_decay: 0.01
  batch_size: 16
  max_epochs: 40
  patience: 8
  num_workers: 2
  augment:
    hflip_p: 0.5
    vflip_p: 0.5
    rotation_deg: 10
    brightness: 0.1
    contrast: 0.1
  out_checkpoint: /kaggle/working/models/baseline/best.pt
  out_dir: /kaggle/working/results/train
  smoke:
    images_per_class: 2
    max_epochs: 1
    out_dir: models/smoke
compare_val:
  split: val
  alpha: 0.05
  reproduce_tolerance: 1.0e-06
  batch_size: 32
  models:
  - name: efficientnet_b0
    checkpoint: models/baseline/best.pt
    results_dir: results/train
  - name: mobilenetv3_small_100
    checkpoint: models/compare/mobilenetv3_small_100/best.pt
    results_dir: results/compare/mobilenetv3_small_100
  out: results/compare/val_mcnemar.json
calibrate:
  t_min: 0.25
  t_max: 4.0
  grid_size: 81
  n_bins: 15
  cv_folds: 5
  seed: 13
  batch_size: 32
  bootstrap:
    n_resamples: 10000
    t_resamples: 2000
    level: 0.95
threshold:
  review_budget: 0.05
  max_risk_ucb: 0.05
  ucb_level: 0.95
  reference_risk: 0.01
  min_coverage: 0.5
  coverage_step: 0.01
  batch_size: 32
  bootstrap:
    n_resamples: 10000
    seed: 17
    level: 0.95
  out_file: threshold.json
ood:
  id_flag_budget: 0.02
  batch_size: 32
  detection_level: 0.95
  fpr_at_tpr: 0.95
  bootstrap:
    n_resamples: 2000
    seed: 19
    level: 0.95
  synthetic:
    seed: 23
    n_per_family: 50
    families:
    - gaussian_noise
    - uniform_noise
    - gradient
    - stripes
    - checkerboard
    - shapes
    - blobs
    - near_flat
  out_file: ood.json
evaluate:
  batch_size: 32
  bootstrap:
    n_resamples: 10000
    seed: 11
    level: 0.95
  out_dir: results/eval
export:
  opset: 18
  out_dir: models/onnx
  report_file: results/onnx/export_report.json
  batch_size: 32
  batch_sizes:
  - 1
  - 7
  - 32
  parity:
    atol: 0.0001
    rtol: 0.0001
quantize:
  calibration_split: train_v1
  calibrate_method: MinMax
  per_channel: true
  activation_type: QInt8
  weight_type: QInt8
  reduce_range: false
  batch_size: 32
  rule:
    max_class_f1_drop: 0.02
    max_macro_f1_drop: 0.01
  latency:
    warmup: 10
    runs: 50
    batch_sizes:
    - 1
    - 32
  report_file: results/onnx/quantization_report.json
promotion:
  champion_alias: champion
  challenger_alias: challenger
  log_file: results/promotion_log.json
  code_url: https://github.com/aryanwaingankar4/defect-inspection-mlops
  gate:
    split: val
    max_macro_f1_drop: 0.01
    max_class_recall_drop: 0.05
    mcnemar_alpha: 0.05
    batch_size: 32
    out_dir: results/promotion
serving:
  bundle_dir: models/serving
  max_upload_bytes: 2097152
  allowed_formats:
  - JPEG
  - PNG
  - BMP
  min_side: 32
  max_pixels: 16777216
  audit_rate: 0.02
  near_blank_max_std: 2.0
review:
  simulated:
    error_rate: 0.0
    seed: 31
    reviewer_id: simulated-reviewer
    limit: 1000
  export:
    out_dir: data/feedback
    report: results/feedback/export_report.json
  stream:
    split: production_stream
    seed: 37
tracking:
  experiment: neu-training
  registered_model: steel-defect-classifier
  smoke_experiment: neu-smoke
  smoke_registered_model: steel-defect-classifier-smoke
  local_uri: sqlite:///mlruns/mlflow.db
kaggle:
  dataset_slug: neu-det-private
  dataset_title: NEU-DET private copy
  kernel_slug: neu-train-launcher
  kernel_title: neu-train-launcher
  accelerator: NvidiaTeslaT4
  num_workers: 2
  repo_url: https://github.com/aryanwaingankar4/defect-inspection-mlops.git
  uv_version: 0.13.6
  notebook_template: notebooks/kaggle_train_launcher.ipynb
  staging_dir: build/kaggle-dataset
  kernel_dir: build/kaggle-kernel
  output_dir: build/kaggle-output
  output_results: results/train
  output_checkpoint: models/baseline/best.pt
  feedback_dataset_slug: neu-feedback-private
  feedback_dataset_title: NEU feedback private
  feedback_staging_dir: build/kaggle-feedback
retrain:
  min_feedback_rows: 50
  versions_dir: models/versions
  state_dir: build/retrain
  results_dir: results/retrain
  poll_seconds: 60
  timeout_minutes: 180
loop:
  pilot:
    cycle_record: results/retrain/cycle_e7f25858ed574f3db2e2f37c4168cadb.json
    gate_file: results/promotion/gate_3.json
  chunks_file: data/splits/loop_chunks.csv
  chunks:
    cycle2: 520
    cycle3: 523
  out_dir: results/loop
  fault_injection:
    rule: shift_to_next_class
    out_dir: data/feedback_fault
    report: results/loop/fault_injection/export_report.json
    feedback_dataset_slug: neu-feedback-fault-private
    feedback_dataset_title: NEU feedback fault injection
    feedback_staging_dir: build/kaggle-feedback-fault
    state_dir: build/retrain-fault
  final_out: results/loop/final_test_frozen.json
near_duplicates:
  hash_size: 8
  max_distance: 8
  report_distances:
  - 0
  - 2
  - 4
  - 6
  - 8
  alert_distance: 2
  grid_top_k: 12
  out_csv: results/near_duplicates.csv
  out_summary: results/near_duplicates_summary.json
  out_grid: results/private/near_duplicates_grid.png
near_duplicates_cnn:
  model: efficientnet_b0
  batch_size: 32
  seed: 7
  report_cosines:
  - 0.85
  - 0.9
  - 0.95
  - 0.97
  - 0.98
  report_pixel_corrs:
  - 0.2
  - 0.3
  - 0.5
  - 0.7
  - 0.9
  candidate_cosine: 0.85
  confirm_pixel_corr: 0.3
  keep_pixel_corr: 0.1
  highpass_px: 9
  max_shift: 48
  calib_same_class_pairs: 20000
  calib_pixel_pairs: 5000
  calib_shift_images_per_class: 30
  calib_shifts:
  - 8
  - 16
  - 32
  max_candidates: 150000
  summary_top_k: 20
  grid_top_k: 24
  watch_pairs:
  - - patches_193.jpg
    - patches_189.jpg
  pairs_file: data/splits/near_copy_pairs.csv
  pairs_summary: results/near_copies_summary.json
  out_csv: results/near_duplicates_cnn.csv
  out_summary: results/near_duplicates_cnn_summary.json
  out_grid: results/private/near_duplicates_cnn_grid.png
