# Local stack: the API with its SQLite prediction log on a named volume (TASK-021), plus
# Prometheus and Grafana with a provisioned dashboard (TASK-032).
# `make docker-up`. API_KEY, AUDIT_SALT and GRAFANA_ADMIN_PASSWORD are read from the shell or .env for
# interpolation only; no env_file, so other .env values (DagsHub credentials) never reach a container.
# Every port is bound to 127.0.0.1 (local only).
name: defect-inspection

services:
  api:
    image: defect-inspection-api:local      # built by `make docker-build` (with model labels)
    build: .
    environment:
      API_KEY: ${API_KEY:?set API_KEY in .env or the shell}
      AUDIT_SALT: ${AUDIT_SALT:?set AUDIT_SALT in .env or the shell}
      DATABASE_URL: sqlite:////data/predictions.db
    volumes:
      - predictions:/data
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m                       # large uploads are spooled here
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env or the shell}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/defect-api.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  predictions:
  prometheus:
  grafana:
